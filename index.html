<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itinerary Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>Itinerary Planner</h1>

  <!-- PROGRESS -->
  <div id="progressBar">
    <div id="dot1"></div>
    <div id="dot2"></div>
    <div id="dot3"></div>
  </div>

  <div id="mainCard">

    <!-- STEP 1 -->
    <section id="step1">
      <h2>Where to?</h2>
      <div id="destinationGrid">
        <button class="choice-card" data-value="Beach">🏖️ Beach</button>
        <button class="choice-card" data-value="City">🏙️ City</button>
        <button class="choice-card" data-value="Nature">🌿 Nature</button>
      </div>
      <button id="nextStep1" disabled>Next</button>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="hidden">
      <h2>Days?</h2>
      <div id="daysGrid">
        <button class="choice-card" data-value="1">1 Day</button>
        <button class="choice-card" data-value="2">2 Days</button>
        <button class="choice-card" data-value="3">3 Days</button>
      </div>
      <button id="backStep2">Back</button>
      <button id="nextStep2" disabled>Next</button>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="hidden">
      <h2>Budget?</h2>
      <div id="budgetGrid">
        <button class="choice-card" data-value="Low">Low</button>
        <button class="choice-card" data-value="Medium">Medium</button>
        <button class="choice-card" data-value="High">High</button>
      </div>
      <div id="summaryBox" class="hidden"></div>
      <button id="backStep3">Back</button>
      <button id="generateBtn" disabled>Generate</button>
    </section>

    <!-- RESULT -->
    <section id="step4" class="hidden">
      <div id="resultIcon"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultMeta"></p>
      <div id="itineraryList"></div>
      <div id="disasterBanner" class="hidden"></div>
      <button id="resetBtn">Reset</button>
    </section>

    <!-- CANCEL -->
    <section id="step5" class="hidden">
      <h2>Cancelled</h2>
      <button id="resetCancelBtn">Start Again</button>
    </section>

  </div>
</div>

<!-- MODAL -->
<div id="disasterModal" class="hidden">
  <p id="modalMsg"></p>
  <button id="cancelBookingBtn">Cancel</button>
  <button id="proceedBtn">Proceed</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
